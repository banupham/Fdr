const KEY = 'cablechecker_auto_v1';
const getChecked = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { return {}; } };
const setChecked = o => localStorage.setItem(KEY, JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function updateCnt() {
  document.getElementById('cntChecked').textContent = Object.keys(getChecked()).length;
}

function makeItem(v, checked, onToggle, extraClass) {
  const el = document.createElement('div');
  const isSpare = v.startsWith('[SPARE] ');
  el.className = 'result' + (extraClass ? ' ' + extraClass : '') +
                 (checked ? ' checked' : '') + (isSpare ? ' spare' : '');
  el.innerHTML = `
    <div class="row">
      <input type="checkbox" ${checked ? 'checked' : ''}>
      <div class="code">${esc(v)}</div>
    </div>`;
  const cb = el.querySelector('input[type=checkbox]');
  cb.addEventListener('change', () => {
    const c = getChecked();
    if (cb.checked) c[v] = 1; else delete c[v];
    setChecked(c);
    el.classList.toggle('checked', cb.checked);
    updateCnt();
    if (onToggle) onToggle();
  });
  return el;
}

function doSearch() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const box = document.getElementById('results');
  box.innerHTML = '';
  if (!q) { document.getElementById('stats').textContent = ''; return; }
  const results = [];
  for (const v of DATA) {
    if (v.toLowerCase().includes(q)) {
      results.push(v);
      if (results.length >= 500) break;
    }
  }
  if (!results.length) {
    document.getElementById('stats').textContent = '❌ Không tìm thấy: ' + q;
    return;
  }
  const checked = getChecked();
  results.forEach(v => {
    box.appendChild(makeItem(v, !!checked[v], () => {
      const c = getChecked();
      const n = results.filter(x => c[x]).length;
      document.getElementById('stats').innerHTML =
        `✅ Tìm thấy <b>${results.length}</b> kết quả — Đã tích: <b>${n}/${results.length}</b>`;
    }));
  });
  const c = getChecked();
  const n = results.filter(x => c[x]).length;
  document.getElementById('stats').innerHTML =
    `✅ Tìm thấy <b>${results.length}</b> kết quả — Đã tích: <b>${n}/${results.length}</b>`;
}

function showChecked() {
  const c = getChecked();
  const list = Object.keys(c).sort();
  const box = document.getElementById('results');
  box.innerHTML = '';

  if (!list.length) {
    document.getElementById('stats').textContent = 'Chưa tích mã nào.';
    box.innerHTML = '<div class="empty">Chưa tích mã nào.<br>Tìm và tích để lưu vào danh sách này.</div>';
    return;
  }

  const actions = document.createElement('div');
  actions.className = 'actions';
  const btnClear = document.createElement('button');
  btnClear.className = 'danger';
  btnClear.textContent = '🗑️ Xoá tất cả (' + list.length + ')';
  btnClear.addEventListener('click', () => {
    if (confirm('Xoá toàn bộ ' + list.length + ' mã đã tích?')) {
      setChecked({}); updateCnt(); showChecked();
    }
  });
  actions.appendChild(btnClear);
  box.appendChild(actions);

  const copyRow = document.createElement('div');
  copyRow.className = 'copy-row';
  const btnCopy = document.createElement('button');
  btnCopy.className = 'alt';
  btnCopy.textContent = '📄 Copy danh sách';
  btnCopy.addEventListener('click', async () => {
    const text = Object.keys(getChecked()).sort().join('\n');
    try {
      await navigator.clipboard.writeText(text);
      btnCopy.textContent = '✅ Đã copy';
    } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      btnCopy.textContent = '✅ Đã copy';
    }
    setTimeout(() => btnCopy.textContent = '📄 Copy danh sách', 1500);
  });
  copyRow.appendChild(btnCopy);
  box.appendChild(copyRow);

  const refresh = () => {
    const c2 = getChecked();
    const remain = list.filter(x => c2[x]).length;
    document.getElementById('stats').innerHTML =
      `📋 Đã tích: <b>${Object.keys(c2).length}</b> mã — Hiển thị <b>${remain}</b> trong danh sách này`;
  };

  list.forEach(v => {
    box.appendChild(makeItem(v, true, () => {
      const c2 = getChecked();
      if (!c2[v]) {
        box.querySelectorAll('.code').forEach(node => {
          if (node.textContent === v) {
            const r = node.closest('.result');
            if (r) r.remove();
          }
        });
      }
      refresh(); updateCnt();
    }, 'checked-list'));
  });
  refresh();
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
updateCnt();
